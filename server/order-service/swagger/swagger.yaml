openapi: 3.0.0
info:
  title: Order Service API
  description: API documentation for the Order Service of the Book Store
  version: 1.0.0
servers:
  - url: http://localhost:5003/api
    description: Order Service API
paths:
  /orders:
    post:
      summary: Create a new order
      tags:
        - Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - shippingAddress
                - paymentMethod
                - totalPrice
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      bookId:
                        type: string
                      title:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                      price:
                        type: number
                shippingAddress:
                  type: object
                  properties:
                    address:
                      type: string
                    city:
                      type: string
                    postalCode:
                      type: string
                    country:
                      type: string
                paymentMethod:
                  type: string
                totalPrice:
                  type: number
      responses:
        201:
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Invalid order data or no order items
        401:
          description: Not authorized
  /orders/user/{userId}:
    get:
      summary: Get all orders by user
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        200:
          description: List of user's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        401:
          description: Not authorized
        500:
          description: Server error
  /orders/{id}:
    get:
      summary: Get order by ID
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        200:
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        401:
          description: Not authorized
        403:
          description: Not authorized to view this order
        404:
          description: Order not found
        500:
          description: Server error
    delete:
      summary: Cancel an order
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        200:
          description: Order cancelled successfully
        400:
          description: Cannot cancel order that has been shipped or delivered
        401:
          description: Not authorized
        403:
          description: Not authorized to cancel this order
        404:
          description: Order not found
        500:
          description: Server error
components:
  schemas:
    Order:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              bookId:
                type: string
              title:
                type: string
              quantity:
                type: integer
              price:
                type: number
        shippingAddress:
          type: object
          properties:
            address:
              type: string
            city:
              type: string
            postalCode:
              type: string
            country:
              type: string
        paymentMethod:
          type: string
        paymentResult:
          type: object
          properties:
            id:
              type: string
            status:
              type: string
            update_time:
              type: string
            email_address:
              type: string
        totalPrice:
          type: number
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
